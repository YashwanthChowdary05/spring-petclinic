apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # 1) kube-prometheus-stack: Prometheus + Grafana + Alertmanager + exporters.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.1.1
      helm:
        releaseName: kps
        valueFiles:
          - $values/k8s/monitoring/values.yaml
    # 2) This repo, referenced to supply the values file above.
    - repoURL: https://github.com/YashwanthChowdary05/spring-petclinic.git
      targetRevision: main
      ref: values
    # 3) The ServiceMonitor that tells Prometheus to scrape PetClinic.
    - repoURL: https://github.com/YashwanthChowdary05/spring-petclinic.git
      targetRevision: main
      path: k8s/monitoring
      directory:
        include: 'servicemonitor.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # large CRDs in this chart need SSA
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
